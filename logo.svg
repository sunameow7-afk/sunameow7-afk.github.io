<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <!-- glossy glass for the arcs (Spotify-style shine) -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e9e4ff"/>
      <stop offset="1" stop-color="#b9a8f5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="tile"><rect x="10" y="10" width="100" height="100" rx="28"/></clipPath>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3s" repeatCount="indefinite"/>

    <!-- pulsing glow -->
    <rect x="14" y="14" width="92" height="92" rx="26" fill="#8b5cf6" filter="url(#soft)" opacity=".7">
      <animate attributeName="opacity" values=".45;.9;.45" dur="2.6s" repeatCount="indefinite"/>
    </rect>

    <!-- tile -->
    <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg)"/>

    <!-- three glossy wipe arcs (the mark) -->
    <g clip-path="url(#tile)" stroke-linecap="round" fill="none">
      <path d="M30 44 C 44 32, 72 31, 90 42" stroke="url(#glass)" stroke-width="13">
        <animateTransform attributeName="transform" type="translate" values="0 0; 4 -2; 0 0" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M27 63 C 45 52, 75 52, 93 63" stroke="url(#glass)" stroke-width="13">
        <animateTransform attributeName="transform" type="translate" values="0 0; 4 -2; 0 0" dur="2.8s" begin="0.35s" repeatCount="indefinite"/>
      </path>
      <path d="M31 82 C 46 72, 70 72, 86 81" stroke="url(#glass)" stroke-width="12">
        <animateTransform attributeName="transform" type="translate" values="0 0; 4 -2; 0 0" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- rotating light sweep -->
    <g clip-path="url(#tile)">
      <g transform="rotate(18 60 60)">
        <rect x="-80" y="-40" width="44" height="200" fill="url(#sheen)">
          <animateTransform attributeName="transform" type="translate" values="0 0; 260 0; 260 0" keyTimes="0;.55;1" dur="3.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
