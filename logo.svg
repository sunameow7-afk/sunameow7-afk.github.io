<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="tile"><rect x="10" y="10" width="100" height="100" rx="28"/></clipPath>
  </defs>

  <!-- whole logo gently floats -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3s" repeatCount="indefinite"/>

    <!-- pulsing glow behind the tile -->
    <rect x="14" y="14" width="92" height="92" rx="26" fill="#8b5cf6" filter="url(#soft)" opacity=".7">
      <animate attributeName="opacity" values=".45;.9;.45" dur="2.6s" repeatCount="indefinite"/>
    </rect>

    <!-- gradient tile -->
    <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg)"/>

    <!-- light sweep, rotating across the tile -->
    <g clip-path="url(#tile)">
      <g transform="rotate(18 60 60)">
        <rect x="-80" y="-40" width="48" height="200" fill="url(#sheen)">
          <animateTransform attributeName="transform" type="translate" values="0 0; 260 0; 260 0" keyTimes="0;.55;1" dur="3.2s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- the D, breathing gently -->
    <g transform="translate(60 62)">
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
            font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="58" fill="#ffffff">D
        <animateTransform attributeName="transform" type="scale" values="1;1.07;1" dur="2.6s" repeatCount="indefinite" additive="replace"/>
      </text>
    </g>
  </g>
</svg>
