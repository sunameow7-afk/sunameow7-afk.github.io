<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#ece7ff"/>
      <stop offset="1" stop-color="#c3b2f7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <clipPath id="tile"><rect x="10" y="10" width="100" height="100" rx="28"/></clipPath>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3s" repeatCount="indefinite"/>

    <!-- pulsing glow -->
    <rect x="14" y="14" width="92" height="92" rx="26" fill="#8b5cf6" filter="url(#soft)" opacity=".7">
      <animate attributeName="opacity" values=".45;.9;.45" dur="2.6s" repeatCount="indefinite"/>
    </rect>

    <!-- tile -->
    <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg)"/>

    <!-- THE MARK: open orbit ring (the wipe sweep) + comet head -->
    <g clip-path="url(#tile)">
      <g transform="rotate(0 60 60)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="9s" repeatCount="indefinite"/>
          <!-- ring with an open gap = the sweep path -->
          <circle cx="60" cy="60" r="33" fill="none" stroke="url(#glass)" stroke-width="12"
                  stroke-linecap="round" stroke-dasharray="165 43" transform="rotate(-55 60 60)"/>
          <!-- comet head at the ring's tip -->
          <circle cx="60" cy="27" r="8.5" fill="#ffffff" filter="url(#glow2)" transform="rotate(-55 60 60)"/>
        </g>
      </g>

      <!-- center sparkle: the shine left behind -->
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.14;1" dur="2.4s" repeatCount="indefinite"/>
        <path d="M60 38 C 63.2 52.5, 67.5 56.8, 82 60 C 67.5 63.2, 63.2 67.5, 60 82 C 56.8 67.5, 52.5 63.2, 38 60 C 52.5 56.8, 56.8 52.5, 60 38 Z" fill="url(#glass)"/>
      </g>

      <!-- rotating light sweep across the tile -->
      <g transform="rotate(18 60 60)">
        <rect x="-80" y="-40" width="44" height="200" fill="url(#sheen)" opacity=".8">
          <animateTransform attributeName="transform" type="translate" values="0 0; 260 0; 260 0" keyTimes="0;.55;1" dur="3.4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
